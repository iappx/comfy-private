name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: 'ComfyUI git ref (blank = Dockerfile default)'
        required: false
      cuda_image:
        description: 'Base CUDA image (blank = Dockerfile default)'
        required: false
      torch_index_url:
        description: 'PyTorch wheel index (blank = Dockerfile default)'
        required: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Lint shell scripts
        run: shellcheck entrypoint.sh comfyui.sh ci/smoke-test.sh

      - name: Lint Dockerfile
        run: docker build --check .

      - name: Build the SSH twin
        run: docker build -f ci/Dockerfile.sshtest -t comfy-sshtest:ci .

      - name: Verify SSH hardening
        run: ci/smoke-test.sh comfy-sshtest:ci

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Resolve build configuration
        id: cfg
        env:
          REPOSITORY: ${{ github.repository }}
          IN_COMFYUI_REF: ${{ inputs.comfyui_ref }}
          IN_CUDA_IMAGE: ${{ inputs.cuda_image }}
          IN_TORCH_INDEX_URL: ${{ inputs.torch_index_url }}
        run: |
          arg_default() { sed -n "s/^ARG $1=//p" Dockerfile | head -1; }
          comfyui_ref=${IN_COMFYUI_REF:-$(arg_default COMFYUI_REF)}
          cuda_image=${IN_CUDA_IMAGE:-$(arg_default CUDA_IMAGE)}
          torch_index_url=${IN_TORCH_INDEX_URL:-$(arg_default TORCH_INDEX_URL)}
          {
            echo "image=ghcr.io/${REPOSITORY,,}"
            echo "comfyui_ref=$comfyui_ref"
            echo 'build_args<<__EOF__'
            echo "COMFYUI_REF=$comfyui_ref"
            echo "CUDA_IMAGE=$cuda_image"
            echo "TORCH_INDEX_URL=$torch_index_url"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.cfg.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=comfy-${{ steps.cfg.outputs.comfyui_ref }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ steps.cfg.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cfg.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.cfg.outputs.image }}:buildcache,mode=max
